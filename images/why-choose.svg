<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#1a1a2e" rx="15"/>
  
  <!-- Central Target -->
  <circle cx="250" cy="200" r="80" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  <circle cx="250" cy="200" r="60" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="250" cy="200" r="40" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="250" cy="200" r="20" fill="url(#grad1)"/>
  
  <!-- Arrows hitting target -->
  <line x1="100" y1="120" x2="230" y2="190" stroke="#10b981" stroke-width="3"/>
  <polygon points="230,190 220,180 225,195" fill="#10b981"/>
  
  <line x1="400" y1="100" x2="270" y2="185" stroke="#06b6d4" stroke-width="3"/>
  <polygon points="270,185 280,175 275,190" fill="#06b6d4"/>
  
  <!-- Checkmarks -->
  <circle cx="100" cy="320" r="25" fill="#10b981"/>
  <polyline points="90,320 97,327 113,311" fill="none" stroke="white" stroke-width="3"/>
  <text x="135" y="325" fill="white" font-size="12">Specialized Strategies</text>
  
  <circle cx="300" cy="320" r="25" fill="#10b981"/>
  <polyline points="290,320 297,327 313,311" fill="none" stroke="white" stroke-width="3"/>
  <text x="335" y="325" fill="white" font-size="12">Data-Driven</text>
  
  <!-- Floating stats -->
  <rect x="60" y="180" width="60" height="40" rx="5" fill="#2a2a4a" stroke="url(#grad1)" stroke-width="1"/>
  <text x="75" y="205" fill="white" font-size="14" font-weight="bold">98%</text>
  <text x="70" y="215" fill="#888" font-size="8">Success</text>
  
  <rect x="380" y="220" width="70" height="40" rx="5" fill="#2a2a4a" stroke="url(#grad1)" stroke-width="1"/>
  <text x="395" y="245" fill="white" font-size="14" font-weight="bold">24/7</text>
  <text x="390" y="255" fill="#888" font-size="8">Support</text>
</svg>
