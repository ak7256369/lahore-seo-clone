<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="#1a1a2e"/>
  
  <!-- Influencer figure -->
  <circle cx="200" cy="80" r="40" fill="#0f0f1a" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="200" cy="70" r="25" fill="url(#grad1)"/>
  
  <!-- Megaphone -->
  <path d="M180,90 L140,110 L140,130 L180,120 Z" fill="url(#grad1)"/>
  <ellipse cx="180" cy="105" rx="8" ry="15" fill="#0f0f1a"/>
  
  <!-- Sound waves -->
  <path d="M130,95 Q110,120 130,145" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <path d="M115,85 Q85,120 115,155" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  <path d="M100,75 Q60,120 100,165" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  
  <!-- Follower icons -->
  <circle cx="280" cy="60" r="15" fill="#2a2a4a"/>
  <circle cx="280" cy="55" r="8" fill="url(#grad1)" opacity="0.5"/>
  
  <circle cx="320" cy="90" r="18" fill="#2a2a4a"/>
  <circle cx="320" cy="83" r="10" fill="url(#grad1)" opacity="0.5"/>
  
  <circle cx="300" cy="140" r="20" fill="#2a2a4a"/>
  <circle cx="300" cy="132" r="12" fill="url(#grad1)" opacity="0.5"/>
  
  <circle cx="340" cy="160" r="14" fill="#2a2a4a"/>
  <circle cx="340" cy="155" r="8" fill="url(#grad1)" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="215" y1="85" x2="265" y2="60" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="4"/>
  <line x1="215" y1="95" x2="302" y2="90" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="4"/>
  <line x1="210" y1="110" x2="280" y2="140" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Trend arrow -->
  <path d="M50,200 L100,160 L150,175 L200,140 L250,155 L300,110 L350,80" fill="none" stroke="#10b981" stroke-width="3"/>
  <polygon points="350,80 340,75 340,85" fill="#10b981"/>
  
  <!-- Year label -->
  <text x="330" y="220" fill="#888" font-size="12">2023</text>
</svg>
