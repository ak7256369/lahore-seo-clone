<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>
  
  <!-- Brand elements -->
  <circle cx="200" cy="150" r="80" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  <circle cx="200" cy="150" r="60" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- Logo placeholder -->
  <text x="165" y="165" fill="url(#grad1)" font-size="48" font-weight="bold">B</text>
  
  <!-- Brand colorS -->
  <rect x="60" y="50" width="30" height="30" rx="5" fill="#7c3aed"/>
  <rect x="100" y="50" width="30" height="30" rx="5" fill="#ec4899"/>
  <rect x="140" y="50" width="30" height="30" rx="5" fill="#06b6d4"/>
  
  <!-- Typography lines -->
  <rect x="270" y="55" width="80" height="8" rx="4" fill="#3a3a5a"/>
  <rect x="270" y="70" width="60" height="6" rx="3" fill="#2a2a4a"/>
  
  <!-- Style guides -->
  <rect x="50" y="250" width="300" height="35" rx="5" fill="#0f0f1a" stroke="url(#grad1)" stroke-width="1"/>
  <rect x="65" y="260" width="50" height="15" rx="3" fill="url(#grad1)"/>
  <rect x="125" y="262" width="80" height="10" rx="2" fill="#3a3a5a"/>
  <rect x="215" y="262" width="60" height="10" rx="2" fill="#2a2a4a"/>
</svg>
