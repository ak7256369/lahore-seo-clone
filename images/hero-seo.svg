<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="300" cy="250" r="200" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Browser Window -->
  <rect x="120" y="80" width="360" height="280" rx="10" fill="#1a1a2e" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="145" cy="100" r="6" fill="#ef4444"/>
  <circle cx="165" cy="100" r="6" fill="#fbbf24"/>
  <circle cx="185" cy="100" r="6" fill="#10b981"/>
  <rect x="130" y="120" width="340" height="230" fill="#0f0f1a"/>
  
  <!-- Search Bar -->
  <rect x="150" y="140" width="280" height="30" rx="15" fill="#2a2a4a"/>
  <circle cx="170" cy="155" r="8" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <line x1="176" y1="161" x2="182" y2="167" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="160" fill="#888" font-size="12">lahoreseoservices.com</text>
  
  <!-- Analytics Chart -->
  <rect x="150" y="190" width="130" height="80" rx="5" fill="#2a2a4a"/>
  <polyline points="165,250 185,230 205,240 225,210 245,225 265,195" stroke="url(#grad1)" stroke-width="3" fill="none"/>
  
  <!-- Growth Arrow -->
  <path d="M240,200 L260,180 L255,180 L255,175 L265,175 L265,185 L260,185 L260,180" fill="#10b981"/>
  
  <!-- Data Boxes -->
  <rect x="300" y="190" width="140" height="35" rx="5" fill="#2a2a4a"/>
  <rect x="310" y="200" width="40" height="15" rx="3" fill="url(#grad1)"/>
  <rect x="360" y="200" width="60" height="10" rx="2" fill="#3a3a5a"/>
  
  <rect x="300" y="235" width="140" height="35" rx="5" fill="#2a2a4a"/>
  <rect x="310" y="245" width="40" height="15" rx="3" fill="url(#grad2)"/>
  <rect x="360" y="245" width="50" height="10" rx="2" fill="#3a3a5a"/>
  
  <!-- SEO Icons -->
  <circle cx="380" cy="310" r="25" fill="url(#grad1)"/>
  <text x="370" y="318" fill="white" font-size="20" font-weight="bold">S</text>
  
  <circle cx="420" cy="330" r="20" fill="url(#grad2)"/>
  <text x="412" y="337" fill="white" font-size="16" font-weight="bold">E</text>
  
  <circle cx="340" cy="320" r="18" fill="#ec4899"/>
  <text x="333" y="327" fill="white" font-size="14" font-weight="bold">O</text>
  
  <!-- Floating Elements -->
  <rect x="480" y="120" width="80" height="50" rx="8" fill="#1a1a2e" stroke="url(#grad1)" stroke-width="1"/>
  <text x="495" y="145" fill="white" font-size="18" font-weight="bold">+150%</text>
  <text x="500" y="160" fill="#888" font-size="10">Traffic</text>
  
  <rect x="40" y="200" width="70" height="45" rx="8" fill="#1a1a2e" stroke="url(#grad2)" stroke-width="1"/>
  <text x="50" y="222" fill="white" font-size="14" font-weight="bold">#1</text>
  <text x="50" y="236" fill="#888" font-size="9">Ranking</text>
  
  <!-- Connection Lines -->
  <line x1="110" y1="222" x2="150" y2="222" stroke="url(#grad2)" stroke-width="1" stroke-dasharray="4"/>
  <line x1="470" y1="145" x2="480" y2="145" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="4"/>
</svg>
