<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>
  
  <!-- Dashboard mockup -->
  <rect x="30" y="30" width="340" height="240" rx="10" fill="#0f0f1a" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="30" y="30" width="340" height="40" rx="10" fill="#2a2a4a"/>
  <circle cx="55" cy="50" r="6" fill="#ef4444"/>
  <circle cx="75" cy="50" r="6" fill="#fbbf24"/>
  <circle cx="95" cy="50" r="6" fill="#10b981"/>
  
  <!-- Charts -->
  <rect x="50" y="85" width="150" height="80" rx="5" fill="#2a2a4a"/>
  <polyline points="65,140 85,120 105,130 125,100 145,115 165,90 185,105" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Pie Chart -->
  <circle cx="290" cy="125" r="40" fill="url(#grad1)" opacity="0.3"/>
  <path d="M290,125 L290,85 A40,40 0 0,1 325,140 Z" fill="url(#grad1)"/>
  <path d="M290,125 L325,140 A40,40 0 0,1 255,140 Z" fill="#06b6d4"/>
  
  <!-- Data rows -->
  <rect x="50" y="180" width="130" height="25" rx="3" fill="#2a2a4a"/>
  <rect x="190" y="180" width="130" height="25" rx="3" fill="#2a2a4a"/>
  <rect x="50" y="215" width="130" height="25" rx="3" fill="#2a2a4a"/>
  <rect x="190" y="215" width="130" height="25" rx="3" fill="#2a2a4a"/>
  
  <!-- Progress bars -->
  <rect x="60" y="188" width="80" height="8" rx="4" fill="url(#grad1)"/>
  <rect x="200" y="188" width="60" height="8" rx="4" fill="#06b6d4"/>
  <rect x="60" y="223" width="100" height="8" rx="4" fill="#ec4899"/>
  <rect x="200" y="223" width="40" height="8" rx="4" fill="#10b981"/>
</svg>
