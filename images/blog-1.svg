<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="#1a1a2e"/>
  
  <!-- Light bulb for creativity -->
  <ellipse cx="200" cy="100" rx="50" ry="60" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  <ellipse cx="200" cy="100" rx="40" ry="50" fill="url(#grad1)" opacity="0.3"/>
  
  <!-- Bulb base -->
  <rect x="180" y="155" width="40" height="20" rx="3" fill="#3a3a5a"/>
  <rect x="185" y="175" width="30" height="8" rx="2" fill="#2a2a4a"/>
  
  <!-- Light rays -->
  <line x1="200" y1="20" x2="200" y2="5" stroke="#fbbf24" stroke-width="3"/>
  <line x1="140" y1="50" x2="125" y2="40" stroke="#fbbf24" stroke-width="3"/>
  <line x1="260" y1="50" x2="275" y2="40" stroke="#fbbf24" stroke-width="3"/>
  <line x1="115" y1="100" x2="95" y2="100" stroke="#fbbf24" stroke-width="3"/>
  <line x1="285" y1="100" x2="305" y2="100" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Sparkles -->
  <circle cx="320" cy="60" r="5" fill="#fbbf24"/>
  <circle cx="80" cy="80" r="4" fill="#ec4899"/>
  <circle cx="350" cy="140" r="3" fill="#06b6d4"/>
  <circle cx="50" cy="160" r="4" fill="#7c3aed"/>
  
  <!-- Text placeholder -->
  <rect x="100" y="210" width="200" height="10" rx="5" fill="#3a3a5a"/>
  <rect x="130" y="230" width="140" height="6" rx="3" fill="#2a2a4a"/>
</svg>
