<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e"/>
  
  <!-- Mobile screens -->
  <rect x="80" y="40" width="100" height="180" rx="15" fill="#0f0f1a" stroke="url(#grad1)" stroke-width="2"/>
  <rect x="90" y="60" width="80" height="130" rx="5" fill="#2a2a4a"/>
  <circle cx="130" cy="205" r="8" fill="#3a3a5a"/>
  
  <!-- Ad content on mobile -->
  <rect x="95" y="70" width="70" height="40" rx="3" fill="url(#grad1)" opacity="0.4"/>
  <rect x="95" y="120" width="50" height="6" rx="3" fill="#3a3a5a"/>
  <rect x="95" y="135" width="70" height="4" rx="2" fill="#4a4a6a"/>
  <rect x="95" y="160" width="40" height="15" rx="3" fill="url(#grad1)"/>
  
  <!-- Desktop ad -->
  <rect x="200" y="60" width="160" height="120" rx="10" fill="#0f0f1a" stroke="url(#grad1)" stroke-width="2"/>
  <rect x="210" y="80" width="70" height="50" rx="5" fill="url(#grad1)" opacity="0.4"/>
  <rect x="290" y="85" width="55" height="8" rx="4" fill="#3a3a5a"/>
  <rect x="290" y="100" width="50" height="5" rx="2" fill="#2a2a4a"/>
  <rect x="290" y="115" width="45" height="12" rx="3" fill="url(#grad1)"/>
  <rect x="210" y="145" width="140" height="25" rx="5" fill="#10b981" opacity="0.8"/>
  <text x="250" y="163" fill="white" font-size="10">Click Here</text>
  
  <!-- Stats -->
  <rect x="200" y="200" width="160" height="50" rx="8" fill="#2a2a4a"/>
  <text x="220" y="225" fill="white" font-size="12">CTR: </text>
  <text x="255" y="225" fill="#10b981" font-size="14" font-weight="bold">4.5%</text>
  <text x="300" y="225" fill="white" font-size="12">CPC: </text>
  <text x="335" y="225" fill="#06b6d4" font-size="14" font-weight="bold">$0.45</text>
</svg>
