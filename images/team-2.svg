<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="350" fill="#1a1a2e"/>
  
  <!-- Person (female) -->
  <circle cx="150" cy="120" r="60" fill="#2a2a4a"/>
  <circle cx="150" cy="100" r="40" fill="url(#grad1)"/>
  
  <!-- Hair -->
  <ellipse cx="150" cy="80" rx="45" ry="35" fill="#3a3a5a"/>
  <ellipse cx="110" cy="110" rx="15" ry="40" fill="#3a3a5a"/>
  <ellipse cx="190" cy="110" rx="15" ry="40" fill="#3a3a5a"/>
  
  <!-- Face -->
  <circle cx="150" cy="100" r="35" fill="url(#grad1)"/>
  
  <!-- Eyes -->
  <circle cx="138" cy="95" r="4" fill="white"/>
  <circle cx="162" cy="95" r="4" fill="white"/>
  <circle cx="139" cy="95" r="2" fill="#0f0f1a"/>
  <circle cx="163" cy="95" r="2" fill="#0f0f1a"/>
  
  <!-- Smile -->
  <path d="M135 108 Q150 118 165 108" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Body -->
  <ellipse cx="150" cy="200" rx="55" ry="70" fill="url(#grad1)"/>
  
</svg>
